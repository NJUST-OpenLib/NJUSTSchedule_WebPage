<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="梨课程 · 南京理工大学课程表：登录教务系统同步课表、成绩、考试安排与校园余额。">
  <meta name="theme-color" content="#7F6DCE">

  <!-- 分享卡片：微信 / QQ / 微博等抓取 og:* 生成标题与缩略图。
       缺这些标签时，部分平台会回退到奇怪的默认名（如 "my flutter app"），
       所以这里显式写死，避免分享出去的标题不对。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="梨课程">
  <meta property="og:title" content="梨课程 · 南京理工大学课程表">
  <meta property="og:description" content="梨课程 · 南京理工大学课程表：登录教务系统同步课表、成绩、考试安排与校园余额。">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="梨课程 · 南京理工大学课程表">
  <meta name="twitter:description" content="梨课程 · 南京理工大学课程表：登录教务系统同步课表、成绩、考试安排与校园余额。">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- 提前握手，省掉首个跨域请求的 DNS/TCP/TLS 往返。只预热「首屏必然用到、
       且时机在 10 秒内」的域——preconnect 会真的建连接，闲置约 10 秒就被浏览器
       回收，留给几十秒后才用到的域等于白建（还会占连接槽）。
       实测本地产物在浏览器里的 27 个请求，跨域只有下面两个域 + 自家 CDN。 -->

  <!-- 字体字形：Web 端字体不打包进产物，Skia 排版缺字形时从这里按需下载
       （见 flutter_bootstrap.js），实测首屏 15 个请求。 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 引擎本体：CanvasKit 的 canvaskit.js 与 canvaskit.wasm（单文件 5~6MB，首屏最大的一笔）从 gstatic CDN 取，实测 2 个请求。两个都写是因为凭据模式不同：js 由
       <script> 加载（include），wasm 由 fetch 加载（等同 omit），只写一条会有一半
       请求用不上预热。 -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">

  <!-- 自家资源 CDN：首屏会拉远程端点配置，但请求量极小，开销主要在 DNS 解析，
       用 dns-prefetch 即可——不占连接，DNS 缓存留存时间也比 preconnect 长。 -->
  <link rel="dns-prefetch" href="//course-cdn.njust.store">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="梨课程">
  <!-- 添加到主屏幕的图标：用根目录的 apple-touch-icon.png（180×180，由
       tool/gen_web_icons.py 生成）。iOS 会主动探测这个**固定文件名**，显式写
       路径更稳妥；尺寸也必须是 180×180——给别的尺寸它自己缩，边缘会糊。
       该文件必须是不透明 PNG（透明处 iOS 会填黑），生成时已用白底铺满。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon：favicon.ico 是多尺寸默认图标（16/32/48/64），浏览器标签页
       与书签优先使用；png 作为不支持 ico 时的补充。 -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>梨课程</title>
  <link rel="manifest" href="manifest.json">

  <!--
    首屏加载提示：Flutter Web 的产物（尤其 CanvasKit）有几 MB，下载 + 引擎初始化
    期间页面是全白的，容易被当成"打不开"。这里用纯 HTML/CSS 先画一张加载卡片，
    首帧渲染（flutter-first-frame）后淡出移除——没有任何额外请求。
  -->
  <style>
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #F6F4FF;
      color: #4A3F7A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      transition: opacity .28s ease;
    }

    #loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      box-shadow: 0 10px 24px rgba(127, 109, 206, .28);
    }

    #loading-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    #loading-version {
      font-size: 12px;
      font-weight: 500;
      opacity: .6;
    }

    #loading-text {
      font-size: 13.5px;
      opacity: .78;
    }

    #loading-bar {
      width: 168px;
      height: 4px;
      border-radius: 999px;
      background: #E4DEFA;
      overflow: hidden;
    }

    #loading-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #7F6DCE;
      animation: loading-slide 1.1s ease-in-out infinite;
    }

    @keyframes loading-slide {
      0% {
        transform: translateX(-105%);
      }

      100% {
        transform: translateX(255%);
      }
    }

    #loading-retry {
      margin-top: 2px;
      padding: 9px 20px;
      border: none;
      border-radius: 999px;
      background: #7F6DCE;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 加载迟迟不完成时的求助入口：说清「可能是代理被学校屏蔽」并给加群链接，
       否则用户只会对着「正在加载…」反复刷新。 */
    #loading-help {
      max-width: 272px;
      font-size: 12px;
      line-height: 1.65;
      text-align: center;
      opacity: .85;
    }

    #loading-help a {
      color: #7F6DCE;
      font-weight: 700;
      text-decoration: underline;
    }

    @media (prefers-color-scheme: dark) {
      #loading {
        background: #1B1826;
        color: #D9D2F5;
      }

      #loading-bar {
        background: #332C47;
      }

      #loading-help a {
        color: #BBA9F5;
      }
    }
  </style>

  <!-- Web 端的两个统计：百度统计（记 PV）+ Microsoft Clarity（会话回放），
       国内均可达（Firebase 已彻底移除，Web 端本来也没有 Firebase 实现）。
       两者都**只定义注入函数、不自动执行**：由 Dart 侧在拿到「数据收集」授权后
       调用 window.__pearInjectBaiduAnalytics() / window.__pearInjectClarity()
       动态注入——实现见 lib/app/telemetry_gate.dart，且只作用于 Web 端（原生端
       另走 clarity_flutter）。未授权时脚本不会被加载，也就没有任何统计请求。 -->
  <script>
    window.__pearInjectBaiduAnalytics = function () {
      if (window.__pearBaiduAnalyticsInjected) return;
      window.__pearBaiduAnalyticsInjected = true;
      var _hmt = window._hmt = window._hmt || [];
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?3a257dfc1ac85b4d20bf1ca9a736da95";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    };

    // 单页应用的路由切换不会自动产生 PV：Flutter 侧的路由变化（push / pop）
    // 由这里显式上报，调用方见 lib/app/page_view_observer.dart。
    // 还没授权（脚本没注入）时直接返回——那时 _hmt 队列没有意义。
    window.__pearTrackPageview = function (path) {
      if (!window.__pearBaiduAnalyticsInjected) return;
      window._hmt = window._hmt || [];
      window._hmt.push(['_trackPageview', path]);
    };
  </script>

  <!-- Microsoft Clarity（Web 版）：同上——只定义注入函数、不自动执行，由
       lib/app/telemetry_gate.dart 在拿到授权后调用；未授权时脚本不加载。
       函数体保持 Clarity 官方片段原样，便于对照官方文档。
       注意这**与原生端不是同一个项目**：Web 端 tag ID 是 yy5lsyuwg8，原生端是
       yu11c22alm（见 lib/app/telemetry_gate_io.dart），两边数据分开看。 -->
  <script>
    window.__pearInjectClarity = function () {
      if (window.__pearClarityInjected) return;
      window.__pearClarityInjected = true;
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yy5lsyuwg8");
    };
  </script>
</head>

<body>
  <div id="loading" role="status" aria-live="polite">
    <img id="loading-logo" src="icons/Icon-192.png" alt="梨课程">
    <div id="loading-title">梨课程网页版<span id="loading-version"></span></div>
    <div id="loading-text">正在加载…</div>
    <div id="loading-bar"></div>
    <button id="loading-retry" hidden>重新加载</button>
    <!-- 超时兜底时显示（见下方脚本）：Web 端的教务请求要走我们自建的网页代理，
         代理出口被学校屏蔽时用户侧就是「一直加载」，必须给出提示与反馈入口。 -->
    <div id="loading-help" hidden>
      加载失败？可能是网页代理被学校屏蔽或网络异常。<br>
      有问题请加群反馈：
      <a href="https://qm.qq.com/q/uokGSwrQDm" target="_blank" rel="noopener noreferrer">1095467610</a>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('loading');
      var done = false;

      function hide() {
        if (done || !overlay) return;
        done = true;
        overlay.classList.add('is-hidden');
        // 淡出结束后再真正移出布局，避免挡住首帧的点击。
        setTimeout(function () {
          if (overlay) overlay.style.display = 'none';
        }, 320);
      }

      // Flutter 画完第一帧就会广播这个事件：此时界面已经可用，撤掉提示层。
      window.addEventListener('flutter-first-frame', hide);
      window.addEventListener('pagehide', hide);

      // 兜底：引擎迟迟起不来（网络不通、产物没更新完）时给一个出口，
      // 而不是让用户对着"正在加载…"一直等。
      setTimeout(function () {
        if (done || !overlay) return;
        var text = document.getElementById('loading-text');
        if (text) text.textContent = '加载时间较长，可能是网络不通或版本正在更新…';
        var help = document.getElementById('loading-help');
        if (help) help.hidden = false;
        var retry = document.getElementById('loading-retry');
        if (retry) {
          retry.hidden = false;
          retry.onclick = function () {
            window.location.reload();
          };
        }
      }, 25000);

      // 版本号写在 manifest.json 里（发版只改那一处），读不到就不显示。
      fetch('manifest.json')
        .then(function (response) { return response.json(); })
        .then(function (manifest) {
          var slot = document.getElementById('loading-version');
          if (slot && manifest && manifest.version) {
            slot.textContent = ' ' + manifest.version;
          }
        })
        .catch(function () { /* 读不到版本号不影响加载 */ });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
